# /etc/nginx/nginx.conf
# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nobody;
worker_processes auto;
# error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
# include /usr/share/nginx/modules/*.conf;

# error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

worker_rlimit_nofile 65535;

events {
    worker_connections  2048;
}


http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /usr/local/services/tnginx_1_0_0-1.0/conf/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    # include /etc/nginx/conf.d/*.conf;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    #sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    #keepalive_timeout  65;

    #gzip  on;

    # upstream web_backend {
    #     server 127.0.0.1:5000;
    # }

    # upstream v1_web_backend {
    #     server 127.0.0.1:60060;
    # }

    # upstream print_backend {
    #     server 127.0.0.1:60030;
    # }
    # include mime.types;

    server {
        listen       80;
        listen       [::]:80;
        # server_name  cn.idata.oa.com web.en.idata.oa.com;
        root         /data/code/dist-docs;
        index index.html;


        # Load configuration files for the default server block.
        # include /etc/nginx/default.d/*.conf;


        location / {
                root         /data/code/dist-docs;
                # proxy_pass http://web_backend;


                # If request comes from allowed subdomain
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Credentials;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Allow-Headers;
                # (*.website.com) then we enable CORS
                if ($http_origin ~* (http?://.*\.woa\.com(:[0-9]+)?$)) {
                  add_header Access-Control-Allow-Origin "$http_origin";
                  add_header Access-Control-Allow-Credentials true;
                  add_header Access-Control-Allow-Methods 'GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS';
                  add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Origin, X-Requested-With, Content-Disposition, Content-Type, Accept, Accept-Language, Range, sign, timestamp, pid';
                  add_header Access-Control-Expose-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Origin, X-Requested-With, Content-Disposition, Content-Type, Accept, Accept-Language, Range, sign, timestamp, pid';
                }


                # add_header X-Frame-Options "SAMEORIGIN" always;
                # proxy_http_version 1.1;
                # proxy_set_header Upgrade $http_upgrade;
                # proxy_set_header Connection 'upgrade';
                # proxy_set_header Host $host;
                # proxy_cache_bypass $http_upgrade;
        }

        # error_page 404 /404.html;
        #     location = /40x.html {
        # }

        # error_page 500 502 503 504 /50x.html;
        #     location = /50x.html {
        # }
    }

